<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Temporarily Unavailable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 600px;
      background: white;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    img.logo {
      width: 180px;
      height: auto;
      margin-bottom: 20px;
    }
    h1 {
      font-weight: 600;
      color:rgb(238, 81, 8);
    }
    p {
      color: #555;
      font-size: 1.1rem;
      margin-top: 15px;
    }
    .spinner-border {
      margin-top: 25px;
      color:rgb(238, 81, 8);
    }
    footer {
      font-size: 0.9rem;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="site/img/bof-logo.png" alt="Beacon of Compassion Foundation Logo" class="logo">
    <h1>Website Temporarily Unavailable</h1>
    <p>We’re currently performing updates and maintenance.  
       Please check back again soon.</p>
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <footer>
      © <span id="year"></span> Beacon of Compassion Foundation
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
